name: CICD with ArgoCD

on:
  workflow_dispatch

jobs:
  cicd:
    runs-on: ubuntu-latest

    env:
      imageName: argocddemo

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Build the code
        run: mvn package

      - name: Install docker buildx tool
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.imageName }}:${{ github.run_number }}

      - name: Trigger Deployment using ArgoCD
        run: |
          cd argocdhelm
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          git pull origin master --rebase

          sed -i "s/^  tag: .*/  tag: ${{ github.run_number }}/" values.yaml

          git add values.yaml
          git commit -m "Update file values.yaml" || echo "No changes"
          git push origin master
