name: CICD with ArgoCD

on:
  workflow_dispatch

# Prevent parallel Git pushes (VERY IMPORTANT)
concurrency:
  group: argocd-deploy
  cancel-in-progress: false

jobs:
  cicd:
    runs-on: ubuntu-latest

    env:
      imageName: argocddemo

    steps:
      # 1️⃣ Checkout FULL git history
      - name: Checkout the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Setup Java
      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      # 3️⃣ Build Java app
      - name: Build the code
        run: mvn package

      # 4️⃣ Setup Docker Buildx
      - name: Install docker buildx tool
        uses: docker/setup-buildx-action@v3

      # 5️⃣ Login to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6️⃣ Build & Push Docker Image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.imageName }}:${{ github.run_number }}

      # 7️⃣ Update Helm values.yaml (GitOps trigger for ArgoCD)
      - name: Trigger Deployment using ArgoCD
        run: |
          cd argocdhelm

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          for i in 1 2 3; do
            echo "Attempt $i"

            git pull origin master --rebase || continue

            sed -i "s/^  tag: .*/  tag: ${{ github.run_number }}/" values.yaml

            git add values.yaml
            git commit -m "Update file values.yaml" || echo "No changes to commit"

            git push origin master && break

            echo "Push failed, retrying..."
            sleep 5
          done
